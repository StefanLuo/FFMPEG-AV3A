# CI & Release workflow — build (auto-detect), package and create GitHub Release
name: CI & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (optional, e.g. v1.2.3)'
        required: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.upload.outputs.artifact-name || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup cache for build outputs
        uses: actions/cache@v4
        with:
          path: |
            build
            dist
            ~/.cache
            ~/.ccache
          key: ${{ runner.os }}-build-${{ hashFiles('**/build.sh', '**/Makefile', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config yasm nasm git ca-certificates curl unzip wget cmake

      - name: Install libuavs3d (AVS3 decoder)
        if: runner.os == 'Linux'
        run: |
          set -e
          # download uavs3d master zip from codeload as requested
          TMPDIR=$(mktemp -d)
          echo "Using temp dir: $TMPDIR"
          cd "$TMPDIR"
          wget -O uavs3d-master.zip https://codeload.github.com/uavs3/uavs3d/zip/refs/heads/master
          unzip uavs3d-master.zip
          # extracted folder name is usually uavs3d-master
          SRC_DIR="$TMPDIR"/uavs3d-master
          if [ ! -d "$SRC_DIR" ]; then
            # try to find the extracted folder
            SRC_DIR=$(find . -maxdepth 2 -type d -name "uavs3d*" | head -n1)
          fi
          echo "Source dir: $SRC_DIR"
          cd "$SRC_DIR"
          chmod +x version.sh || true
          ./version.sh || true
          mkdir -p build/linux
          cd build/linux
          # Configure with 10-bit support and shared libs; set install prefix to /usr/local
          cmake -DCOMPILE_10BIT=1 -DBUILD_SHARED_LIBS=1 -DCMAKE_INSTALL_PREFIX=/usr/local ../..
          make -j$(nproc)
          sudo make install
          # cleanup
          cd /
          rm -rf "$TMPDIR" || true

      - name: Build (auto-detect)
        run: |
          set -e
          if [ -f "./build.sh" ]; then
            echo "Found build.sh — running it"
            chmod +x ./build.sh
            ./build.sh
          elif [ -f "./configure" ]; then
            echo "Found configure — running configure && make"
            ./configure --prefix="$PWD/build"
            make -j$(nproc)
            make install
          elif [ -f "Makefile" ]; then
            echo "Found Makefile — running make"
            make -j$(nproc)
          elif [ -f "CMakeLists.txt" ]; then
            echo "Found CMakeLists.txt — building with CMake"
            mkdir -p build
            cd build
            cmake .. -DCMAKE_BUILD_TYPE=Release
            cmake --build . --parallel
          else
            echo "No standard build files detected. Skipping build step."
          fi

      - name: Run tests if present
        run: |
          set -e
          if [ -f "./run_tests.sh" ]; then
            chmod +x ./run_tests.sh
            ./run_tests.sh
          elif [ -f "./tests/run_tests.sh" ]; then
            chmod +x ./tests/run_tests.sh
            ./tests/run_tests.sh
          else
            echo "No test script found. Skipping tests."
          fi

      - name: Prepare dist folder
        run: |
          mkdir -p dist
          # Common places to collect build output
          if [ -d build ]; then cp -r build/* dist/ || true; fi
          if [ -d output ]; then cp -r output/* dist/ || true; fi
          if [ -d bin ]; then cp -r bin/* dist/ || true; fi

      - name: Upload build artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: dist
      - name: Set artifact output
        if: always()
        run: |
          # expose uploaded artifact name for downstream jobs (best-effort)
          echo "artifact-name=build-artifact" >> $GITHUB_OUTPUT

  release:
    name: Package & Release
    runs-on: ubuntu-latest
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'workflow_dispatch'
    env:
      DISPATCH_VERSION: ${{ github.event.inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Try download build artifact (if any)
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: ./artifact
        continue-on-error: true

      - name: Determine version
        id: set_version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ -n "$DISPATCH_VERSION" ]]; then
            VERSION="$DISPATCH_VERSION"
          else
            VERSION="0.0.0-$(date +%Y%m%d%H%M)-${GITHUB_SHA:0:7}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create release archive
        id: create_archive
        run: |
          set -e
          ts="${{ steps.set_version.outputs.version }}"
          mkdir -p release_pack
          # If artifact/dist exists, prefer it
          if [ -d ./artifact/dist ] && [ "$(ls -A ./artifact/dist)" ]; then
            cp -r ./artifact/dist/* release_pack/ || true
          else
            # fallback: package repository files (exclude .git)
            rsync -av --exclude='.git' ./ release_pack/ || true
          fi
          archive_name="${ts}.tar.gz"
          tar -czf "$archive_name" -C release_pack .
          echo "archive=$archive_name" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ steps.set_version.outputs.version }}
          release_name: ${{ steps.set_version.outputs.version }}
          body: Automated release created by CI pipeline.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.create_archive.outputs.archive }}
          asset_name: ${{ steps.set_version.outputs.version }}.tar.gz
          asset_content_type: application/gzip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
